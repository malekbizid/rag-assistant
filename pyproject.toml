[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragassist"
version = "0.1.0"
description = "Assistant RAG documentaire avec protocole d'évaluation (retrieval, fidélité, exactitude, latence, coût)"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "chromadb>=1.0",
    "langchain-google-genai>=3.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "pandas>=2.0"]
tracing = ["langfuse>=3.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
